<script>
  // Each talk directory is a Slidev deck, and Slidev routes slides as real paths
  // (/talks/sotm-paris-2026/3). GitHub Pages only honours a 404.html at the site
  // root, so a deck's own SPA fallback is never reached — a reload mid-deck, or a
  // shared link to a slide, lands here. Send those back to the deck's first slide
  // instead of a dead end.
  //
  // The slide number is lost: Slidev has no supported way to be told which slide
  // to open from outside the app. Landing on slide 1 beats landing on a 404.
  //
  // The equality guard matters — without it, a path for a talk that does not exist
  // would redirect to itself forever.
  var deck = location.pathname.match(/^(\/talks\/[^/]+\/)/);
  if (deck && location.pathname !== deck[1]) location.replace(deck[1]);
</script>
