<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <style>
      /* Accent matches the deck, so the index and the slides read as one thing. */
      :root {
        --ink: #171717;
        --muted: #737373;
        --rule: #e5e5e5;
        --accent: #57814c;
        --paper: #fff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #ededed;
          --muted: #a3a3a3;
          --rule: #333;
          --accent: #9ec091;
          --paper: #171717;
        }
      }

      body {
        max-width: 34rem;
        margin: 0 auto;
        padding: 5rem 1.5rem;
        background: var(--paper);
        color: var(--ink);
        font: 1rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: 1.5rem;
        font-weight: 600;
      }

      /* Years are signposts, not content — small and quiet, so the talk titles
         stay the largest thing on the page. */
      h2 {
        margin: 2.5rem 0 1.25rem;
        color: var(--muted);
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .talk + .talk {
        margin-top: 1.75rem;
      }

      .talk .where {
        margin: 0;
        color: var(--muted);
        font-size: 0.875rem;
      }

      .talk h3 {
        margin: 0.125rem 0 0.375rem;
        font-size: 1.0625rem;
        font-weight: 600;
      }

      .talk .links {
        margin: 0;
        font-size: 0.875rem;
      }

      .talk .pending {
        color: var(--muted);
      }

      a {
        color: var(--accent);
      }

      hr {
        margin: 3.5rem 0 1.5rem;
        border: 0;
        border-top: 1px solid var(--rule);
      }

      /* The footer is whatever follows the rule — no extra markup needed for it. */
      hr ~ p {
        color: var(--muted);
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    {{ content }}
  </body>
</html>
