<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <style>
      /* Accent matches the deck, so the index and the slides read as one thing. */
      :root {
        --ink: #171717;
        --muted: #737373;
        --rule: #e5e5e5;
        /* Darker than the deck's #57814c, which lands at 4.52:1 on white — over
           the 4.5 AA threshold by 0.02, at 14px. This is 6.37:1. */
        --accent: #45683c;
        --paper: #fff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #ededed;
          --muted: #a3a3a3;
          --rule: #333;
          --accent: #9ec091;
          --paper: #171717;
        }
      }

      body {
        max-width: 34rem;
        margin: 0 auto;
        padding: 5rem 1.5rem;
        background: var(--paper);
        color: var(--ink);
        font: 1rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: 1.5rem;
        font-weight: 600;
      }

      /* Most visitors arrive from a conference programme with no idea what the
         project is. One sentence, then out of the way. */
      .intro {
        margin: 0;
        max-width: 30rem;
        color: var(--muted);
      }

      /* Slidev scales a fixed 1280x720 canvas to fit the viewport and never
         reflows, so on a phone a deck is a small letterboxed strip. Better to say
         so here than to let someone tap through to 5px text. Its own line, quieter
         than the sentence above it, because it is a footnote and not the pitch. */
      .intro .caveat {
        display: block;
        margin-top: 0.5rem;
        font-size: 0.875rem;
      }

      /* Years are signposts, not content — small and quiet, so the talk titles
         stay the largest thing on the page. */
      h2 {
        margin: 2.5rem 0 1.25rem;
        color: var(--muted);
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .talk + .talk {
        margin-top: 1.75rem;
      }

      .talk .where {
        margin: 0;
        color: var(--muted);
        font-size: 0.875rem;
      }

      .talk h3 {
        margin: 0.125rem 0 0.375rem;
        font-size: 1.0625rem;
        font-weight: 600;
      }

      .talk .links {
        margin: 0;
        font-size: 0.875rem;
      }

      /* Names the format and weight of a download, so nobody on a phone taps a
         link and gets several MB they did not ask for. Replaced .pending, which
         went unused once every talk had slides online. */
      .talk .meta {
        color: var(--muted);
      }

      a {
        color: var(--accent);
      }

      hr {
        margin: 3.5rem 0 1.5rem;
        border: 0;
        border-top: 1px solid var(--rule);
      }

      .footer-links {
        margin: 0;
        color: var(--muted);
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>{{ content }}</main>
  </body>
</html>
